<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Clubverse</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body>
    <div class="container">
      <header class="heading">
        <p class="logo">CLUB<span>VERSE</span></p>
        <nav class="navigation">
          <a href="index.html">Home</a>
          <a href="login.html">Login</a>
        </nav>
      </header>

      <hr />

      <main class="hero">
        <section class="form-fill">
          <form action="#" id="register-form">
            <p class="title">JOIN THE COMMUNITY</p>
            <h1>Create your account</h1>
            <p class="description">
              Sign up to explore clubs and manage membership requests.
            </p>

            <div class="fill">
              <div class="row-1">
                <div class="left-col">
                  <label for="name">Full name</label>
                  <input
                    type="text"
                    id="name"
                    required
                    placeholder="Enter your name"
                  />
                </div>
                <div class="right-col">
                  <label for="sid">Student ID</label>
                  <input
                    type="text"
                    id="sid"
                    required
                    placeholder="Enter student ID (e.g: stu101)"
                  />
                </div>
              </div>

              <div class="row-2">
                <label for="email">College email</label>
                <input
                  type="email"
                  id="email"
                  required
                  placeholder="abc@example.com"
                />
              </div>

              <div class="row-3">
                <div class="left-col">
                  <label for="pswrd">Password</label>
                  <div class="p">
                    <input
                      type="password"
                      id="pswrd"
                      required
                      minlength="8"
                      maxlength="12"
                      placeholder="character length (8-12)"
                    />
                    <i class="far fa-eye eye"></i>
                  </div>
                </div>
                <div class="right-col">
                  <label for="confirm">Confirm password</label>
                  <div class="p">
                    <input type="password" id="confirm" required />
                    <i class="far fa-eye eye"></i>
                  </div>
                </div>
              </div>

              <button class="btn">Create Account</button>
            </div>
          </form>

          <p class="ask">Already have an account?<a href="login.html">Log in</a></p>
        </section>
      </main>
    </div>

    <script src="js/common.js"></script>
    <script src="js/storage.js"></script>
    <script type="module" src="js/register.js"></script>
  </body>
</html>
